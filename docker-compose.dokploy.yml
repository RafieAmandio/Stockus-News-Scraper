services:
  bot:
    build: .
    container_name: stockus-news-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
    volumes:
      - bot-data:/app/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  bot-data:
